<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>Plan zajęć</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <button
    id="hamburger"
    class="hamburger"
    type="button"
    aria-label="Menu"
    aria-expanded="false"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <aside
    id="sidepanel"
    class="sidepanel"
    aria-hidden="true"
  >
    <h3>Plan</h3>

    <ul>
<li>
        <label>
          <input
            type="radio"
            name="mode"
            value="np"
          >
          11E NP
        </label>
      </li>

      <li>
        <label>
          <input
            type="radio"
            name="mode"
            value="air"
          >
          21AiR SP
        </label>
      </li>
    </ul>
  </aside>

  <div
    id="backdrop"
    class="backdrop"
    hidden
  ></div>

  <main class="container">
    <h1 id="view-title">Plan zajęć</h1>

    <div
      class="week-switch"
      id="weeks"
    ></div>

    <section
      id="grid"
      class="grid"
    >
      <div
        class="col"
        id="col-left"
      ></div>

      <div
        class="col"
        id="col-right"
      ></div>
    </section>

    <p
      id="status"
      class="status"
    ></p>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
